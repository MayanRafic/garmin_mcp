name: Lint

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.13

    - name: Check formatting
      run: uvx ruff@0.9.6 format --check --diff .

    - name: Lint
      run: uvx ruff@0.9.6 check --output-format=github .

    - name: Lint summary
      if: always()
      run: echo "Ruff formatting and lint checks completed"
